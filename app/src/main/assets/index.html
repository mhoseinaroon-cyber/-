
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ماموریت پرچم</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102039;color:#eef6ff;font-family:Tahoma,Arial,sans-serif}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#91c9e8}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;z-index:2;pointer-events:none}
.pill{background:#102039dd;border:1px solid #ffffff35;border-radius:12px;padding:8px;font-size:12px;font-weight:bold}
#controls{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 14px;z-index:5;pointer-events:none}
.pad{display:flex;gap:10px;pointer-events:auto}
.control{width:66px;height:64px;border:2px solid #ffffffaa;border-radius:18px;background:#102039e8;color:white;font-size:25px;font-weight:bold;user-select:none;-webkit-user-select:none;touch-action:none;pointer-events:auto}
#jump{width:80px;height:72px;background:#2378c5ed;font-size:17px;position:relative;z-index:6;pointer-events:auto}
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:#071323a8}
.card{width:min(440px,100%);background:#12243af5;border:1px solid #ffffff35;border-radius:22px;padding:24px 18px;text-align:center}
h1{margin:0 0 10px;font-size:26px}
#message{line-height:1.9;font-size:14px;color:#d8e8f8;margin:12px 0 18px}
.action{border:0;border-radius:13px;background:#32d477;color:#082719;font-size:17px;font-weight:bold;padding:13px 22px;min-width:160px}
.secondary{display:block;margin:12px auto 0;background:#ffffff14;border:1px solid #ffffff38;color:white}
.small{font-size:12px;color:#b9cee2;margin-top:14px;line-height:1.7}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="game">
<canvas id="screen"></canvas>
<div id="hud">
<div class="pill" id="levelText">مرحله ۱</div>
<div class="pill" id="statusText">پرچم قرمز را پایین بیاور!</div>
<div class="pill" id="lifeText">❤️ ۳</div>
</div>
<div id="controls">
<div class="pad">
<button class="control" id="left">◀</button>
<button class="control" id="right">▶</button>
</div>
<button class="control" id="jump">پرش ⤴</button>
</div>
<div id="overlay">
<div class="card">
<h1 id="title">ماموریت پرچم</h1>
<div id="message">از سکوها بگذر، از دشمن‌ها دوری کن، پرچم قرمز را پایین بیاور و پرچم سبز را بالا ببر!</div>
<button class="action" id="start">شروع بازی</button>
<button class="action secondary hidden" id="next">مرحله بعد</button>
<div class="small">کنترل: چپ و راست برای حرکت، پرش برای پریدن.</div>
</div>
</div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const overlay=$('overlay'),titleEl=$('title'),messageEl=$('message'),startBtn=$('start'),nextBtn=$('next');
let W=0,H=0,DPR=1,cameraX=0,lastTime=0,state='menu',levelIndex=0,lives=3,jumpQueued=false,checkpointX=70,invincible=0,elapsed=0,redLowered=false;
const input={left:false,right:false},gravity=.62;
const levels=[
{length:2200,platforms:[[0,0,520,90],[600,0,260,90],[940,0,320,90],[1360,0,360,90],[1800,0,400,90],[300,130,130,18],[500,205,120,18],[760,145,140,18],[1030,220,130,18],[1240,150,130,18],[1510,220,130,18],[1720,145,120,18]],red:1920,green:2050,enemies:[[420,350,510,1.2],[1010,960,1210,1.5],[1560,1520,1680,1.35]]},
{length:2600,platforms:[[0,0,400,90],[470,0,260,90],[810,0,260,90],[1170,0,300,90],[1550,0,250,90],[1900,0,300,90],[2280,0,320,90],[260,145,125,18],[550,215,130,18],[850,145,120,18],[1080,220,120,18],[1320,150,120,18],[1600,220,120,18],[1850,150,120,18],[2130,220,120,18]],red:2310,green:2440,enemies:[[520,480,700,1.7],[1240,1190,1440,1.6],[1970,1920,2160,1.8]]},
{length:3000,platforms:[[0,0,430,90],[500,0,240,90],[820,0,300,90],[1200,0,280,90],[1560,0,280,90],[1920,0,300,90],[2300,0,250,90],[2630,0,370,90],[280,155,130,18],[560,220,120,18],[900,155,120,18],[1120,230,120,18],[1400,160,120,18],[1690,225,120,18],[2000,160,120,18],[2240,225,120,18],[2490,155,120,18]],red:2700,green:2830,enemies:[[560,510,700,1.8],[1290,1220,1450,1.9],[1980,1940,2200,1.7],[2400,2320,2500,2]]}
];
const player={x:70,y:0,w:32,h:44,vx:0,vy:0,onGround:true,facing:1};
let platforms=[],enemies=[],length=2200,redX=1920,greenX=2050;
function groundY(){return H-68}
function resize(){const r=canvas.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=Math.max(320,r.width);H=Math.max(240,r.height);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function buildLevel(){const L=levels[levelIndex];length=L.length;platforms=L.platforms.map(p=>({x:p[0],y:p[1],w:p[2],h:p[3]}));enemies=L.enemies.map(e=>({x:e[0],min:e[1],max:e[2],speed:e[3],w:32,h:28,dir:1,alive:true}));redX=L.red;greenX=L.green;player.x=70;player.y=groundY()-player.h;player.vx=player.vy=0;player.onGround=true;player.facing=1;cameraX=0;checkpointX=70;redLowered=false;invincible=1.3;$('levelText').textContent='مرحله '+(levelIndex+1);$('statusText').textContent='پرچم قرمز را پایین بیاور!';$('lifeText').textContent='❤️ '+lives}
function show(title,msg,button='ادامه'){titleEl.textContent=title;messageEl.textContent=msg;startBtn.textContent=button;overlay.classList.remove('hidden')}
function startGame(){levelIndex=0;lives=3;elapsed=0;buildLevel();state='playing';nextBtn.classList.add('hidden');startBtn.classList.remove('hidden');overlay.classList.add('hidden')}
startBtn.addEventListener('click',()=>{if(state==='won')levelIndex=0;startGame()});
nextBtn.addEventListener('click',()=>{if(state!=='leveldone')return;levelIndex++;if(levelIndex>=levels.length){state='won';nextBtn.classList.add('hidden');startBtn.classList.remove('hidden');show('پیروزی!','هر سه مرحله را کامل کردی و پرچم سبز را بالا بردی!','بازی دوباره');return}buildLevel();state='playing';overlay.classList.add('hidden');nextBtn.classList.add('hidden');startBtn.classList.remove('hidden')});
function loseLife(){if(invincible>0)return;lives--;$('lifeText').textContent='❤️ '+lives;if(lives<=0){state='gameover';show('پایان بازی','دوباره تلاش کن و از دشمن‌ها دوری کن!','تلاش دوباره');return}player.x=checkpointX;player.y=groundY()-player.h;player.vx=player.vy=0;invincible=2}
function bindHold(id,key){const el=$(id);const down=e=>{e.preventDefault();input[key]=true};const up=e=>{e.preventDefault();input[key]=false};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,up));el.addEventListener('contextmenu',e=>e.preventDefault())}
bindHold('left','left');bindHold('right','right');
function requestJump(e){e.preventDefault();if(state==='playing')jumpQueued=true}
$('jump').addEventListener('pointerdown',requestJump);
$('jump').addEventListener('click',requestJump);
$('jump').addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp','a','d','w'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')input.left=true;if(e.key==='ArrowRight'||e.key==='d')input.right=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jumpQueued=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.left=false;if(e.key==='ArrowRight'||e.key==='d')input.right=false});
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){if(state!=='playing'){jumpQueued=false;return}elapsed+=dt;invincible=Math.max(0,invincible-dt);const scale=dt*60;player.vx=((input.right?1:0)-(input.left?1:0))*3.8;if(player.vx)player.facing=Math.sign(player.vx);if(jumpQueued&&player.onGround){player.vy=-12.5;player.onGround=false}jumpQueued=false;const oldY=player.y;player.x=Math.max(0,Math.min(length-player.w,player.x+player.vx*scale));player.vy+=gravity*scale;player.y+=player.vy*scale;player.onGround=false;const gy=groundY();if(player.y+player.h>=gy&&oldY+player.h<=gy+10&&player.vy>=0){player.y=gy-player.h;player.vy=0;player.onGround=true}
for(const p of platforms){const py=gy-p.y;if(p.y>0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.vy>=0&&oldY+player.h<=py+8&&player.y+player.h>=py){player.y=py-player.h;player.vy=0;player.onGround=true}}
for(const en of enemies){if(!en.alive)continue;en.x+=en.speed*en.dir*scale;if(en.x<en.min){en.x=en.min;en.dir=1}if(en.x+en.w>en.max){en.x=en.max-en.w;en.dir=-1}const er={x:en.x,y:gy-en.h,w:en.w,h:en.h};if(hit(player,er)){if(player.vy>1&&oldY+player.h<=er.y+12){en.alive=false;player.vy=-7}else loseLife()}}
if(player.y>H+120)loseLife();if(player.x>redX&&!redLowered){redLowered=true;$('statusText').textContent='حالا به پرچم سبز برس!'}if(redLowered&&player.x>greenX){state='leveldone';$('statusText').textContent='مرحله کامل شد';nextBtn.classList.remove('hidden');startBtn.classList.add('hidden');show('مرحله کامل شد!','پرچم قرمز پایین آمد و پرچم سبز بالا رفت!','');nextBtn.textContent=levelIndex===levels.length-1?'پایان بازی':'مرحله بعد'}cameraX=Math.max(0,Math.min(length-W,player.x-W*.35))}
function background(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#75bce7');g.addColorStop(1,'#d9f0f7');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff88';for(let i=0;i<5;i++){let x=((i*190-cameraX*.18)%(W+200)+W+200)%(W+200)-60,y=42+(i%3)*37;ctx.beginPath();ctx.ellipse(x,y,34,12,0,0,7);ctx.ellipse(x+22,y-5,23,15,0,0,7);ctx.ellipse(x+43,y,26,10,0,0,7);ctx.fill()}ctx.fillStyle='#80bb9c';ctx.beginPath();ctx.moveTo(0,groundY());for(let x=0;x<=W+10;x+=20)ctx.lineTo(x,groundY()-12-Math.sin((x+cameraX*.2)*.02)*13);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
function flag(x,color,lower=false){let sx=x-cameraX,gy=groundY();ctx.fillStyle='#f3f4f6';ctx.fillRect(sx,gy-92,5,92);ctx.fillStyle=color;if(lower)ctx.fillRect(sx+5,gy-28,44,16);else{ctx.beginPath();ctx.moveTo(sx+5,gy-90);ctx.lineTo(sx+53,gy-76);ctx.lineTo(sx+5,gy-61);ctx.closePath();ctx.fill()}}
function draw(){background();const gy=groundY();ctx.fillStyle='#315a47';ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='#53ac5b';ctx.fillRect(0,gy,W,8);for(const p of platforms){let x=p.x-cameraX,y=gy-p.y;if(x+p.w<-10||x>W+10)continue;ctx.fillStyle='#8c6544';ctx.fillRect(x,y,p.w,p.h);ctx.fillStyle='#5ab95f';ctx.fillRect(x,y,p.w,6);ctx.fillStyle='#65432f';for(let bx=x+12;bx<x+p.w;bx+=30)ctx.fillRect(bx,y+12,12,4)}
for(const en of enemies){if(!en.alive)continue;let x=en.x-cameraX,y=gy-en.h;ctx.fillStyle='#d94a45';ctx.fillRect(x,y+7,en.w,en.h-7);ctx.fillStyle='#fff4dd';ctx.fillRect(x+6,y+3,7,8);ctx.fillRect(x+20,y+3,7,8);ctx.fillStyle='#18243a';ctx.fillRect(x+8,y+6,4,4);ctx.fillRect(x+22,y+6,4,4);ctx.fillStyle='#4b2c29';ctx.fillRect(x+4,y+en.h-2,9,6);ctx.fillRect(x+21,y+en.h-2,9,6)}
flag(redX,'#f0444e',redLowered);flag(greenX,'#32d477',state==='leveldone');const x=player.x-cameraX,y=player.y;ctx.fillStyle='#243b63';ctx.fillRect(x+5,y+28,9,15);ctx.fillRect(x+19,y+28,9,15);ctx.fillStyle='#32d477';ctx.fillRect(x+3,y+13,27,19);ctx.fillStyle='#f0c49b';ctx.fillRect(x+5,y,23,17);ctx.fillStyle='#17253b';ctx.fillRect(x+3,y-2,27,7);ctx.fillRect(x+7,y+8,20,5);ctx.fillStyle='#202e40';ctx.fillRect(x+(player.facing>0?16:5),y+7,12,5);ctx.fillStyle='#f4f7fa';ctx.fillRect(x+(player.facing>0?23:7),y+5,3,3);ctx.fillStyle='#102039';ctx.fillRect(x+7,y+43,10,3);ctx.fillRect(x+20,y+43,9,3)}
function frame(ts){if(!lastTime)lastTime=ts;const dt=Math.min((ts-lastTime)/1000,.033);lastTime=ts;update(dt);draw();requestAnimationFrame(frame)}
buildLevel();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
